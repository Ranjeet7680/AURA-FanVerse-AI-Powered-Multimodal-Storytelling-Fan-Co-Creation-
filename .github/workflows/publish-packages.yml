name: 📦 Publish GitHub Packages & Containers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Choose package targets to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'containers'
          - 'npm'
          - 'nuget'
          - 'maven'
          - 'rubygems'

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. DOCKER CONTAINERS (GitHub Container Registry - ghcr.io)
  # ============================================================================
  publish-containers:
    if: inputs.publish_target == 'all' || inputs.publish_target == 'containers' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. NPM PACKAGE (GitHub Packages - npm.pkg.github.com)
  # ============================================================================
  publish-npm:
    if: inputs.publish_target == 'all' || inputs.publish_target == 'npm' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ranjeet7680'

      - name: Install & Build Package
        working-directory: ./packages/npm
        run: |
          npm install typescript --save-dev
          npx tsc --init || true
          npx tsc src/index.ts --outDir dist --declaration || true

      - name: Publish to GitHub npm Registry
        working-directory: ./packages/npm
        run: npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 3. NUGET PACKAGE (GitHub Packages - nuget.pkg.github.com)
  # ============================================================================
  publish-nuget:
    if: inputs.publish_target == 'all' || inputs.publish_target == 'nuget' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet Package
        run: dotnet pack ./packages/nuget/AuraFanVerse.Client.csproj -c Release -o ./nupkg

      - name: Push to GitHub NuGet Registry
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
          dotnet nuget push ./nupkg/*.nupkg --source "github" --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }} || true

  # ============================================================================
  # 4. APACHE MAVEN (GitHub Packages - maven.pkg.github.com)
  # ============================================================================
  publish-maven:
    if: inputs.publish_target == 'all' || inputs.publish_target == 'maven' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Deploy with Maven
        working-directory: ./packages/maven
        run: mvn deploy -DskipTests -s ${{ github.workspace }}/settings.xml || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 5. RUBYGEMS (GitHub Packages - rubygems.pkg.github.com)
  # ============================================================================
  publish-rubygems:
    if: inputs.publish_target == 'all' || inputs.publish_target == 'rubygems' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Build and Push Gem
        working-directory: ./packages/rubygems
        run: |
          gem build aura_fanverse.gemspec
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":github: Bearer ${{ secrets.GITHUB_TOKEN }}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push --key github --host https://rubygems.pkg.github.com/${{ github.repository_owner }} *.gem || true
