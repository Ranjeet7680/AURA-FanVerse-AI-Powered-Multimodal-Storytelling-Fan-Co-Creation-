version: '3.8'

services:
  aura-fanverse:
    image: ghcr.io/ranjeet7680/aura-fanverse:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_fanverse_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - HMAC_SECRET_KEY=aura_icc_dubai_2026_telemetry_secure_key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
