<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d10-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <linearGradient id="d10-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="d10-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d10-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d10-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d10-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    
    @keyframes d10PulseNeuron {
      0%, 100% { fill-opacity: 0.4; r: 6px; }
      50% { fill-opacity: 1; r: 8px; }
    }
    @keyframes d10GaugeMove {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(25deg); }
    }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d10-bg)" stroke="url(#d10-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#0b243b" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">📈</text>
    <text x="46" y="19" fill="#FFFFFF" class="d10-title" font-size="16">Diagram 10: Win-Probability &amp; Momentum Neural Network Architecture</text>
    <text x="46" y="33" fill="#94A3B8" class="d10-body" font-size="11">MLP + LSTM Recurrent Network • 2,896 Historical Matches • Sub-10ms Inference • Calibrated Brier Score 0.082</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 28)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#67E8F9" class="d10-mono">MODEL ACCURACY: 98.2% ENSEMBLE</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#1e293b" stroke-width="1"/>

  <!-- COLUMN 1: Input Features Vector X (Left) -->
  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="210" height="345" rx="12" fill="#0b172a" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="28" rx="6" fill="#0c2e47"/>
    <text x="105" y="33" text-anchor="middle" fill="#38BDF8" class="d10-mono">INPUT FEATURES (X)</text>

    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0c2338" stroke="#0284c7" stroke-width="0.8"/>
      <text x="10" y="16" fill="#7DD3FC" class="d10-mono">F1. SCORE / WICKETS</text>
      <text x="10" y="30" fill="#E2E8F0" class="d10-body">156/4 (17.2 overs)</text>
    </g>

    <g transform="translate(15, 102)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0c2338" stroke="#0284c7" stroke-width="0.8"/>
      <text x="10" y="16" fill="#7DD3FC" class="d10-mono">F2. BALLS REMAINING</text>
      <text x="10" y="30" fill="#E2E8F0" class="d10-body">16 balls (Target: 178)</text>
    </g>

    <g transform="translate(15, 149)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0c2338" stroke="#0284c7" stroke-width="0.8"/>
      <text x="10" y="16" fill="#7DD3FC" class="d10-mono">F3. REQ RUN RATE (RRR)</text>
      <text x="10" y="30" fill="#E2E8F0" class="d10-body">8.25 rpo vs 6.88 Current</text>
    </g>

    <g transform="translate(15, 196)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0c2338" stroke="#0284c7" stroke-width="0.8"/>
      <text x="10" y="16" fill="#7DD3FC" class="d10-mono">F4. VENUE HISTORICAL</text>
      <text x="10" y="30" fill="#E2E8F0" class="d10-body">Dubai Stadium Par: 168.4</text>
    </g>

    <g transform="translate(15, 243)">
      <rect x="0" y="0" width="180" height="40" rx="6" fill="#0c2338" stroke="#0284c7" stroke-width="0.8"/>
      <text x="10" y="16" fill="#7DD3FC" class="d10-mono">F5. HEAD-TO-HEAD MATCH</text>
      <text x="10" y="30" fill="#E2E8F0" class="d10-body">Batter vs Bowler: 142.8 SR</text>
    </g>

    <g transform="translate(15, 290)">
      <rect x="0" y="0" width="180" height="42" rx="6" fill="#082b20" stroke="#10B981" stroke-width="0.8"/>
      <text x="10" y="18" fill="#34D399" class="d10-mono">NORMALIZED VECTOR:</text>
      <text x="10" y="32" fill="#A7F3D0" class="d10-mono">[0.72, 0.13, 0.68, 0.94, ...]</text>
    </g>
  </g>

  <!-- COLUMN 2: Neural Layers Architecture (Center) -->
  <g transform="translate(280, 105)">
    <rect x="0" y="0" width="410" height="345" rx="14" fill="#0f1424" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="15" width="370" height="28" rx="6" fill="#1e293b"/>
    <text x="205" y="33" text-anchor="middle" fill="#60A5FA" class="d10-mono">DEEP NEURAL LAYERS (MLP + LSTM)</text>

    <!-- Synapses Canvas Mock -->
    <g transform="translate(30, 65)">
      <!-- Dense Layer 1: 128 Neurons -->
      <g transform="translate(20, 0)">
        <text x="25" y="15" text-anchor="middle" fill="#93C5FD" class="d10-mono">DENSE 1 (128)</text>
        <circle cx="25" cy="45" r="7" fill="#3B82F6" style="animation: d10PulseNeuron 1s infinite;"/>
        <circle cx="25" cy="80" r="7" fill="#3B82F6" style="animation: d10PulseNeuron 1.2s infinite;"/>
        <circle cx="25" cy="115" r="7" fill="#3B82F6" style="animation: d10PulseNeuron 0.9s infinite;"/>
        <circle cx="25" cy="150" r="7" fill="#3B82F6" style="animation: d10PulseNeuron 1.4s infinite;"/>
        <circle cx="25" cy="185" r="7" fill="#3B82F6" style="animation: d10PulseNeuron 1.1s infinite;"/>
        <text x="25" y="215" text-anchor="middle" fill="#60A5FA" class="d10-mono">ReLU</text>
      </g>

      <!-- Interconnecting Synapses -->
      <line x1="45" y1="45" x2="135" y2="70" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="45" y1="80" x2="135" y2="70" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="45" y1="115" x2="135" y2="120" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="45" y1="150" x2="135" y2="120" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="45" y1="185" x2="135" y2="170" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.6"/>

      <!-- LSTM Temporal Layer: 64 Hidden Units -->
      <g transform="translate(135, 0)">
        <text x="25" y="15" text-anchor="middle" fill="#C084FC" class="d10-mono">LSTM (64)</text>
        <circle cx="25" cy="70" r="8" fill="#8B5CF6" style="animation: d10PulseNeuron 1.3s infinite;"/>
        <circle cx="25" cy="120" r="8" fill="#8B5CF6" style="animation: d10PulseNeuron 1.0s infinite;"/>
        <circle cx="25" cy="170" r="8" fill="#8B5CF6" style="animation: d10PulseNeuron 1.5s infinite;"/>
        <text x="25" y="215" text-anchor="middle" fill="#C084FC" class="d10-mono">Temporal Memory</text>
      </g>

      <!-- Synapses to Dropout & Softmax -->
      <line x1="160" y1="70" x2="250" y2="90" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="160" y1="120" x2="250" y2="90" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="160" y1="120" x2="250" y2="150" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6"/>
      <line x1="160" y1="170" x2="250" y2="150" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6"/>

      <!-- Softmax Output Layer -->
      <g transform="translate(250, 0)">
        <text x="25" y="15" text-anchor="middle" fill="#34D399" class="d10-mono">SOFTMAX</text>
        <circle cx="25" cy="90" r="9" fill="#10B981" filter="url(#d10-glow)"/>
        <circle cx="25" cy="150" r="9" fill="#10B981" filter="url(#d10-glow)"/>
        <text x="25" y="215" text-anchor="middle" fill="#34D399" class="d10-mono">σ(z_i)</text>
      </g>
    </g>

    <!-- Formula Footer -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="370" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
      <text x="185" y="26" text-anchor="middle" fill="#C7D2FE" class="d10-mono">σ(z)_i = exp(z_i) / Σ exp(z_j)  |  Dropout rate = 0.20</text>
    </g>
  </g>

  <!-- COLUMN 3: Live Probability Prediction Display (Right) -->
  <g transform="translate(720, 105)">
    <rect x="0" y="0" width="240" height="345" rx="14" fill="#091b24" stroke="#10B981" stroke-width="1.8"/>
    <rect x="15" y="15" width="210" height="28" rx="6" fill="#093834"/>
    <text x="120" y="33" text-anchor="middle" fill="#6EE7B7" class="d10-mono">🎯 LIVE WIN PROBABILITY</text>

    <!-- Team A Win Bar -->
    <g transform="translate(15, 60)">
      <text x="5" y="16" fill="#67E8F9" class="d10-mono">🇮🇳 INDIA WOMEN: 68.4%</text>
      <rect x="0" y="24" width="210" height="18" rx="4" fill="#0f2b38"/>
      <rect x="0" y="24" width="144" height="18" rx="4" fill="#06B6D4">
        <animate attributeName="width" values="140;150;140" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Team B Win Bar -->
    <g transform="translate(15, 115)">
      <text x="5" y="16" fill="#F472B6" class="d10-mono">🏴󠁧󠁢󠁥󠁮󠁧󠁿 ENGLAND WOMEN: 31.6%</text>
      <rect x="0" y="24" width="210" height="18" rx="4" fill="#2d152b"/>
      <rect x="0" y="24" width="66" height="18" rx="4" fill="#EC4899">
        <animate attributeName="width" values="70;60;70" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Momentum Swing Needle Gauge -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="210" height="95" rx="8" fill="#092925" stroke="#10B981" stroke-width="0.8"/>
      <text x="105" y="20" text-anchor="middle" fill="#A7F3D0" class="d10-mono">MOMENTUM SWING DELTA</text>

      <!-- Semi-circle Gauge Arc -->
      <path d="M 45 75 A 60 60 0 0 1 165 75" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
      <path d="M 45 75 A 60 60 0 0 1 140 35" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>

      <!-- Oscillating Needle -->
      <g transform="translate(105, 75)">
        <g style="animation: d10GaugeMove 3s ease-in-out infinite; transform-origin: 0px 0px;">
          <line x1="0" y1="0" x2="30" y2="-40" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
        </g>
      </g>
      <text x="105" y="90" text-anchor="middle" fill="#FBBF24" class="d10-mono">+4.2% IND (Last Ball Four)</text>
    </g>

    <!-- Boundary Risk Metric -->
    <g transform="translate(15, 285)">
      <rect x="0" y="0" width="210" height="48" rx="6" fill="#132438" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="10" y="18" fill="#7DD3FC" class="d10-mono">BOUNDARY RISK INDEX:</text>
      <text x="10" y="36" fill="#34D399" class="d10-mono">0.342 Low Risk (Field Covered)</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="250" y1="275" x2="280" y2="275" stroke="#06B6D4" stroke-width="2.5"/>
  <circle r="4" fill="#06B6D4" filter="url(#d10-glow)">
    <animateMotion path="M 250 275 L 280 275" dur="1s" repeatCount="indefinite"/>
  </circle>

  <line x1="690" y1="275" x2="720" y2="275" stroke="#10B981" stroke-width="2.5"/>
  <circle r="4" fill="#10B981" filter="url(#d10-glow)">
    <animateMotion path="M 690 275 L 720 275" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
