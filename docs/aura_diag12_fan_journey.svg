<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d12-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b061c"/>
      <stop offset="50%" stop-color="#150a2b"/>
      <stop offset="100%" stop-color="#05030e"/>
    </linearGradient>

    <linearGradient id="d12-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="d12-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d12-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d12-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d12-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d12-bg)" stroke="url(#d12-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#2d0b24" stroke="#EC4899" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">🌟</text>
    <text x="46" y="19" fill="#FFFFFF" class="d12-title" font-size="16">Diagram 12: End-to-End Fan Journey State Progression</text>
    <text x="46" y="33" fill="#94A3B8" class="d12-body" font-size="11">Frictionless Web Discovery • Multimodal Storytelling • Tactical Exploration • Grassroots Micro-Pledge</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 28)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#EC4899" fill-opacity="0.12" stroke="#EC4899" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#F472B6" class="d12-mono">FAN RETENTION: +340% LIFT</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#251642" stroke-width="1"/>

  <!-- STEP 1: Discovery & Entry (Top Left) -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#16122e" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="15" y="12" width="150" height="24" rx="5" fill="#25164d"/>
    <text x="90" y="28" text-anchor="middle" fill="#C084FC" class="d12-mono">1. DISCOVERY</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Fan opens Mobile Web</text>
    <text x="15" y="76" fill="#E2E8F0" class="d12-body">or ICC Dubai App</text>
    <text x="15" y="96" fill="#DDD6FE" class="d12-mono">Zero-Install PWA</text>
    <text x="15" y="114" fill="#A78BFA" class="d12-mono">Load Time &lt; 850ms</text>
    <circle cx="160" cy="24" r="4" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STEP 2: Watch 9:16 Micro-Reel (Top Center-Left) -->
  <g transform="translate(285, 110)">
    <rect x="0" y="0" width="190" height="130" rx="12" fill="#2d1033" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="24" rx="5" fill="#4d1654"/>
    <text x="95" y="28" text-anchor="middle" fill="#F472B6" class="d12-mono">2. 9:16 MICRO-REEL</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Autonomous AI Story</text>
    <text x="15" y="76" fill="#E2E8F0" class="d12-body">Six / Wicket Key Highlight</text>
    <text x="15" y="96" fill="#FBCFE8" class="d12-mono">HUD Velocity Overlays</text>
    <text x="15" y="114" fill="#F472B6" class="d12-mono">Equalizer Wavebars 60FPS</text>
    <circle cx="170" cy="24" r="4" fill="#EC4899">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STEP 3: Switch Dialect (Top Center-Right) -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="190" height="130" rx="12" fill="#2d1d07" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="24" rx="5" fill="#4d2f09"/>
    <text x="95" y="28" text-anchor="middle" fill="#FBBF24" class="d12-mono">3. NATIVE DIALECT</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Switches Audio Language:</text>
    <text x="15" y="76" fill="#FDE68A" class="d12-mono">తెలుగు • தமிழ் • हिन्दी</text>
    <text x="15" y="94" fill="#FDE68A" class="d12-mono">English • Español • العربية</text>
    <text x="15" y="114" fill="#FBBF24" class="d12-mono">Seamless Dialect Shift</text>
  </g>

  <!-- STEP 4: Tactical AI Co-Pilot (Top Right) -->
  <g transform="translate(770, 110)">
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#0f192b" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="15" y="12" width="150" height="24" rx="5" fill="#0c2e47"/>
    <text x="90" y="28" text-anchor="middle" fill="#67E8F9" class="d12-mono">4. AI CO-PILOT</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Tactical Question Asked:</text>
    <text x="15" y="76" fill="#94A3B8" class="d12-mono">"Why Deep Sq Leg?"</text>
    <text x="15" y="96" fill="#67E8F9" class="d12-mono">RL Model Reasoning</text>
    <text x="15" y="114" fill="#38BDF8" class="d12-mono">Instant Voice Response</text>
  </g>

  <!-- STEP 5: 2D Pitch Radar (Bottom Right) -->
  <g transform="translate(770, 280)">
    <rect x="0" y="0" width="180" height="140" rx="12" fill="#09241b" stroke="#10B981" stroke-width="1.5"/>
    <rect x="15" y="12" width="150" height="24" rx="5" fill="#0c3d2f"/>
    <text x="90" y="28" text-anchor="middle" fill="#6EE7B7" class="d12-mono">5. 2D PITCH RADAR</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Interacts with Fielder Oval</text>
    <text x="15" y="76" fill="#A7F3D0" class="d12-mono">Tap Trap Fielder (P10)</text>
    <text x="15" y="96" fill="#A7F3D0" class="d12-mono">360° Radar Rotating</text>
    <text x="15" y="116" fill="#34D399" class="d12-mono">Win Probability Shift</text>
  </g>

  <!-- STEP 6: Support Athlete Portal (Bottom Center-Right) -->
  <g transform="translate(530, 280)">
    <rect x="0" y="0" width="190" height="140" rx="12" fill="#1f1136" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="24" rx="5" fill="#321759"/>
    <text x="95" y="28" text-anchor="middle" fill="#C084FC" class="d12-mono">6. ATHLETE PROFILE</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Discovers Grassroots Star</text>
    <text x="15" y="76" fill="#DDD6FE" class="d12-mono">Biometrics &amp; Pitch Stats</text>
    <text x="15" y="96" fill="#DDD6FE" class="d12-mono">Equipment Fund Goal</text>
    <text x="15" y="116" fill="#A78BFA" class="d12-mono">Transparent 85/15 Split</text>
  </g>

  <!-- STEP 7: Micro-Pledge Trigger (Bottom Center-Left) -->
  <g transform="translate(285, 280)">
    <rect x="0" y="0" width="190" height="140" rx="12" fill="#2d0f21" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="24" rx="5" fill="#4d1637"/>
    <text x="95" y="28" text-anchor="middle" fill="#F472B6" class="d12-mono">7. MICRO-PLEDGE</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">Pledges 50 Tokens ($10)</text>
    <text x="15" y="78" fill="#FBCFE8" class="d12-mono">Confetti Celebration</text>
    <text x="15" y="98" fill="#FBCFE8" class="d12-mono">85% Athlete Wallet</text>
    <text x="15" y="118" fill="#F472B6" class="d12-mono">15% ICC Future Stars</text>
  </g>

  <!-- STEP 8: Digital Passport & Impact Badge (Bottom Left - Ultimate Reward) -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="180" height="140" rx="12" fill="#092921" stroke="#10B981" stroke-width="2" filter="url(#d12-glow)"/>
    <rect x="15" y="12" width="150" height="24" rx="5" fill="#0a4034"/>
    <text x="90" y="28" text-anchor="middle" fill="#6EE7B7" class="d12-mono">8. UNLOCK BADGE</text>
    <text x="15" y="58" fill="#E2E8F0" class="d12-body">🏅 Digital Passport NFT</text>
    <text x="15" y="78" fill="#A7F3D0" class="d12-mono">Global Rank: #42 Patron</text>
    <text x="15" y="98" fill="#A7F3D0" class="d12-mono">Proof-of-Impact Ticket</text>
    <text x="15" y="118" fill="#34D399" class="d12-mono">Lifelong Fan Loyalty</text>
    <circle cx="160" cy="24" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ANIMATED AVATAR BEACON TRAVELING THROUGH JOURNEY -->
  <!-- 1 -> 2 -->
  <line x1="230" y1="175" x2="285" y2="175" stroke="#EC4899" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- 2 -> 3 -->
  <line x1="475" y1="175" x2="530" y2="175" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- 3 -> 4 -->
  <line x1="720" y1="175" x2="770" y2="175" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- 4 -> 5 (Down) -->
  <line x1="860" y1="240" x2="860" y2="280" stroke="#10B981" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- 5 -> 6 (Left) -->
  <line x1="770" y1="350" x2="720" y2="350" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- 6 -> 7 (Left) -->
  <line x1="530" y1="350" x2="475" y2="350" stroke="#EC4899" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- 7 -> 8 (Left) -->
  <line x1="285" y1="350" x2="230" y2="350" stroke="#10B981" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Dynamic Traveling Photon Node across entire loop -->
  <circle r="6" fill="#FFFFFF" filter="url(#d12-glow)">
    <animateMotion path="M 140 175 L 380 175 L 625 175 L 860 175 L 860 350 L 625 350 L 380 350 L 140 350 Z" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
