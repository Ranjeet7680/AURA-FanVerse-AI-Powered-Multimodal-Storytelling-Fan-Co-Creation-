      <text x="16" y="11" fill="#E2E8F0" class="font-body" font-size="11">9:16 Vertical Video Reels (&lt;45s)</text>

      <circle cx="6" cy="31" r="3.5" fill="#EC4899" />
      <text x="16" y="35" fill="#E2E8F0" class="font-body" font-size="11">Tactical Co-Pilot (Voice + 2D)</text>

      <circle cx="6" cy="55" r="3.5" fill="#EC4899" />
      <text x="16" y="59" fill="#E2E8F0" class="font-body" font-size="11">Win-Prob Swings (Recharts)</text>

      <circle cx="6" cy="79" r="3.5" fill="#EC4899" />
      <text x="16" y="83" fill="#E2E8F0" class="font-body" font-size="11">Header Diagram ⚡ Console</text>
