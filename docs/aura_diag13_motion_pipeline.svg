      <text x="44" y="19" fill="#22D3EE" class="font-title" font-size="14">THREE.JS WEBGL 60 FPS 3D STADIUM ENGINE</text>
      <text x="44" y="33" fill="#94A3B8" class="font-body" font-size="11">Biomechanical Kinematics • Dynamic Shot Physics • Procedural Audio SFX</text>
    </g>

    <!-- Interactive Sub-Cards -->
