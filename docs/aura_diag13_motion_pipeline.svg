      <text x="16" y="11" fill="#E2E8F0" class="font-body" font-size="11">HMAC-SHA256 Anti-Tamper</text>

      <circle cx="6" cy="31" r="3.5" fill="#A855F7" />
      <text x="16" y="35" fill="#E2E8F0" class="font-body" font-size="11">Adversarial LLM Prompt WAF</text>

      <circle cx="6" cy="55" r="3.5" fill="#A855F7" />
      <text x="16" y="59" fill="#E2E8F0" class="font-body" font-size="11">Token-Bucket Rate Limiter</text>

      <circle cx="6" cy="79" r="3.5" fill="#A855F7" />
      <text x="16" y="83" fill="#E2E8F0" class="font-body" font-size="11">Immutable SOC Incident Ledger</text>
    </g>
  </g>

  <!-- COLUMN 3: FASTAPI ENTERPRISE CORE & AI/ML (X: 585) -->
  <g transform="translate(585, 125)">
    <rect x="0" y="0" width="200" height="180" rx="18" fill="url(#nodeEmerald)" stroke="#10B981" stroke-width="1.8" />
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#10B981" fill-opacity="0.2" />
    <text x="21" y="32" font-size="16">🧠</text>
    <text x="50" y="27" fill="#6EE7B7" class="font-title" font-size="13">FASTAPI AI ENGINE</text>
    <text x="50" y="41" fill="#94A3B8" class="font-body" font-size="10">PINN &amp; Multi-Agent Brain</text>
    <line x1="12" y1="52" x2="188" y2="52" stroke="#10B981" stroke-opacity="0.25" />

    <!-- Sub items -->
    <g transform="translate(14, 65)">
      <circle cx="6" cy="7" r="3.5" fill="#10B981" />
      <text x="16" y="11" fill="#E2E8F0" class="font-body" font-size="11">PINN Differential Ball Physics</text>

      <circle cx="6" cy="31" r="3.5" fill="#10B981" />
      <text x="16" y="35" fill="#E2E8F0" class="font-body" font-size="11">Sub-15ms Action Softmax</text>

      <circle cx="6" cy="55" r="3.5" fill="#10B981" />
      <text x="16" y="59" fill="#E2E8F0" class="font-body" font-size="11">Q-Learning Field Optimizer</text>

      <circle cx="6" cy="79" r="3.5" fill="#10B981" />
      <text x="16" y="83" fill="#E2E8F0" class="font-body" font-size="11">2,896 Match Historical Studio</text>
    </g>
  </g>

