      <!-- Box A: Bowling Biomechanics -->
      <rect x="0" y="0" width="215" height="85" rx="12" fill="#171038" stroke="#06B6D4" stroke-opacity="0.4" />
      <text x="12" y="20" fill="#67E8F9" class="font-title" font-size="11">🏃 4-STAGE BOWLER BIOMECHANICS</text>
      <text x="12" y="38" fill="#CBD5E1" class="font-body" font-size="10">• 18m Accelerated Run-Up (0→6.2m/s)</text>
      <text x="12" y="54" fill="#CBD5E1" class="font-body" font-size="10">• Gather Bound &amp; Front-Foot GRF</text>
      <text x="12" y="70" fill="#CBD5E1" class="font-body" font-size="10">• 360° High-Arm Release (2.3m plane)</text>

      <!-- Box B: Dynamic Batting Stances -->
      <rect x="230" y="0" width="215" height="85" rx="12" fill="#171038" stroke="#06B6D4" stroke-opacity="0.4" />
      <text x="12" y="20" fill="#67E8F9" class="font-title" font-size="11">🏏 6 SHOT-SPECIFIC BATTING ACTIONS</text>
      <text x="12" y="38" fill="#CBD5E1" class="font-body" font-size="10">• High-Elbow Cover Drive &amp; Swivel Pull</text>
      <text x="12" y="54" fill="#CBD5E1" class="font-body" font-size="10">• Straight Loft &amp; Upper Cut Ramp</text>
      <text x="12" y="70" fill="#CBD5E1" class="font-body" font-size="10">• Cartwheeling Stumps &amp; Flying Bails</text>

      <!-- Box C: Volumetric Lighting & Cam -->
      <rect x="0" y="98" width="445" height="78" rx="12" fill="#171038" stroke="#A855F7" stroke-opacity="0.4" />
      <text x="12" y="20" fill="#E879F9" class="font-title" font-size="11">🎥 DYNAMIC SPH-SLERP CAMERA &amp; VOLUMETRIC SCATTER</text>
      <text x="12" y="38" fill="#CBD5E1" class="font-body" font-size="10">• Smooth Broadcaster / Batter POV Slerp Transitions with Quaternion Damping</text>
      <text x="12" y="54" fill="#CBD5E1" class="font-body" font-size="10">• 4 Quad Floodlight Pylons, Clay Pitch Scuff Maps &amp; Spectator Flash Points</text>
      <text x="12" y="70" fill="#A7F3D0" class="font-body" font-size="10">• Procedural Web Audio API Bat-on-Leather Synthesizer (Zero MP3 Dependencies)</text>
    </g>
