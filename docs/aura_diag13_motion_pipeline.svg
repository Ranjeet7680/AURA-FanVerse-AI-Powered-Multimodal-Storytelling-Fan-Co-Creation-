  <g transform="translate(845, 125)">
    <rect x="0" y="0" width="210" height="180" rx="18" fill="url(#nodePurple)" stroke="#EC4899" stroke-width="1.8" />
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#EC4899" fill-opacity="0.2" />
    <text x="21" y="32" font-size="16">📱</text>
    <text x="50" y="27" fill="#F472B6" class="font-title" font-size="13">REACT 19 CLIENT</text>
    <text x="50" y="41" fill="#94A3B8" class="font-body" font-size="10">Ultra-Modern Motion Console</text>
    <line x1="12" y1="52" x2="198" y2="52" stroke="#EC4899" stroke-opacity="0.25" />

