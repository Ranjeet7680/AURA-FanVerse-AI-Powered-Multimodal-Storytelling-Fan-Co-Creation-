      <text x="12" y="22" font-size="15">🇮🇳</text>
      <text x="36" y="22" fill="#D8B4FE" class="font-title" font-size="12">தமிழ் (Tamil)</text>
      <text x="12" y="40" fill="#94A3B8" class="font-mono">Code: ta • Voice: ta-IN</text>

      <!-- Hindi Badge -->
