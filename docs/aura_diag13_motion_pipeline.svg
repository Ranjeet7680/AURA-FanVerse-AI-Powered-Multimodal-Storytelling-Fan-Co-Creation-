<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b061a"/>
      <stop offset="50%" stop-color="#140c2e"/>
      <stop offset="100%" stop-color="#080415"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Node Gradient Cyan-Purple -->
    <linearGradient id="nodeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f3d"/>
      <stop offset="100%" stop-color="#131438"/>
    </linearGradient>

    <!-- Node Gradient Purple-Pink -->
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261040"/>
      <stop offset="100%" stop-color="#190b2b"/>
    </linearGradient>

    <!-- Node Gradient Amber-Gold -->
    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#331e08"/>
      <stop offset="100%" stop-color="#1c1106"/>
    </linearGradient>

    <!-- Node Gradient Emerald -->
    <linearGradient id="nodeEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a22"/>
      <stop offset="100%" stop-color="#091b16"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
    .font-body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
  </style>

  <!-- Deep Backdrop Box -->
  <rect x="10" y="10" width="1080" height="620" rx="28" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="2.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="120" r="160" fill="#06B6D4" opacity="0.08" filter="url(#deepGlow)" />
  <circle cx="920" cy="500" r="180" fill="#EC4899" opacity="0.09" filter="url(#deepGlow)" />
  <circle cx="550" cy="320" r="220" fill="#A855F7" opacity="0.06" filter="url(#deepGlow)" />

  <!-- Header Section -->
  <g transform="translate(45, 38)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="46" height="46" rx="14" fill="#1b103b" stroke="#A855F7" stroke-width="1.8" />
    <path d="M23 8 L35 34 L29 34 L23 20 L17 34 L11 34 Z" fill="url(#neonBorder)" filter="url(#glow)" />
    <circle cx="23" cy="16" r="2.5" fill="#FFFFFF" />

    <!-- Title and Badges -->
    <text x="60" y="24" fill="#FFFFFF" class="font-title" font-size="18" letter-spacing="0.5">
      Diagram 13: End-to-End UI &amp; Motion Animation Pipeline (Framer Motion + Three.js 60 FPS)
    </text>
    <text x="60" y="42" fill="#94A3B8" class="font-body" font-size="12">
      Edge Video Ingestion • PINN Physics • 60 FPS Three.js Canvas • 6-Language Reactive Synapse (Telugu / Tamil / Hindi / English / Spanish / Arabic)
    </text>

    <!-- Top Status Badges -->
    <g transform="translate(740, 2)">
      <!-- 60 FPS Badge -->
      <rect x="0" y="0" width="105" height="26" rx="13" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" fill="#67E8F9" class="font-mono" font-weight="700">60 FPS WEBGL</text>

      <!-- 6-Lang Badge -->
      <rect x="115" y="0" width="135" height="26" rx="13" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="129" cy="13" r="4" fill="#ec4899">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="140" y="17" fill="#F472B6" class="font-mono" font-weight="700">6-LANG SYNAPSE</text>
    </g>
  </g>

  <!-- Divider Line with Moving Gradient Light -->
  <line x1="45" y1="102" x2="1055" y2="102" stroke="#33245c" stroke-width="1.2" />
  <line x1="45" y1="102" x2="300" y2="102" stroke="url(#neonBorder)" stroke-width="2.5">
    <animate attributeName="x1" values="45;800;45" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="300;1055;300" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Animated Data Conduits (Lines with moving dasharray) -->
  <g stroke-linecap="round">
    <!-- Stream 1: Stadium to Security -->
    <path d="M 265 190 L 325 190" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite" />
    </path>

    <!-- Stream 2: Security to FastAPI -->
    <path d="M 525 190 L 585 190" stroke="#A855F7" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite" />
    </path>

    <!-- Stream 3: FastAPI to Presentation -->
    <path d="M 785 190 L 845 190" stroke="#EC4899" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.9s" repeatCount="indefinite" />
    </path>

    <!-- Stream 4: Presentation down to 6-Lang Synapse -->
    <path d="M 965 305 L 965 375 L 785 375" stroke="#10B981" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite" />
    </path>

    <!-- Stream 5: Presentation down to 3D Stadium WebGL Engine -->
    <path d="M 910 305 L 910 440" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.8s" repeatCount="indefinite" />
    </path>

    <!-- Stream 6: Return Loop Telemetry to Security SOC -->
    <path d="M 585 530 L 425 530 L 425 305" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- COLUMN 1: STADIUM EDGE INGESTION (X: 45) -->
  <g transform="translate(45, 125)">
    <rect x="0" y="0" width="220" height="180" rx="18" fill="url(#nodeCyan)" stroke="#06B6D4" stroke-width="1.8" />
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#06B6D4" fill-opacity="0.2" />
    <text x="21" y="32" font-size="16">🏟️</text>
    <text x="50" y="27" fill="#67E8F9" class="font-title" font-size="13">STADIUM EDGE LAYER</text>
    <text x="50" y="41" fill="#94A3B8" class="font-body" font-size="10">Dubai Int. Stadium (4K 60FPS)</text>
    <line x1="12" y1="52" x2="208" y2="52" stroke="#06B6D4" stroke-opacity="0.25" />

    <!-- Sub items -->
    <g transform="translate(14, 65)">
      <circle cx="6" cy="7" r="3.5" fill="#06B6D4" />
      <text x="16" y="11" fill="#E2E8F0" class="font-body" font-size="11">4K RTSP Video Broadcast</text>
      
      <circle cx="6" cy="31" r="3.5" fill="#06B6D4" />
      <text x="16" y="35" fill="#E2E8F0" class="font-body" font-size="11">Hawk-Eye Seam &amp; Turn Radar</text>

      <circle cx="6" cy="55" r="3.5" fill="#06B6D4" />
      <text x="16" y="59" fill="#E2E8F0" class="font-body" font-size="11">Micro-Acoustic Stump Snick</text>

      <circle cx="6" cy="79" r="3.5" fill="#06B6D4" />
      <text x="16" y="83" fill="#E2E8F0" class="font-body" font-size="11">Biomechanical Skeletal Tracker</text>
    </g>
  </g>

  <!-- COLUMN 2: ZERO-TRUST SECURITY GATEWAY (X: 325) -->
  <g transform="translate(325, 125)">
    <rect x="0" y="0" width="200" height="180" rx="18" fill="url(#nodePurple)" stroke="#A855F7" stroke-width="1.8" />
    <rect x="12" y="12" width="30" height="30" rx="8" fill="#A855F7" fill-opacity="0.2" />
    <text x="21" y="32" font-size="16">🛡️</text>
    <text x="50" y="27" fill="#D8B4FE" class="font-title" font-size="13">ZERO-TRUST SHIELD</text>
    <text x="50" y="41" fill="#94A3B8" class="font-body" font-size="10">Cryptographic Telemetry Guard</text>
    <line x1="12" y1="52" x2="188" y2="52" stroke="#A855F7" stroke-opacity="0.25" />

