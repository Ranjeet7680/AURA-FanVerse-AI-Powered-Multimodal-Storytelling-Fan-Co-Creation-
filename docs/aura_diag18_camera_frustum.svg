<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d18-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071a"/>
      <stop offset="50%" stop-color="#110d2b"/>
      <stop offset="100%" stop-color="#04030d"/>
    </linearGradient>

    <linearGradient id="d18-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="d18-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d18-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d18-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d18-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .d18-eq { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 12px; font-weight: bold; fill: #FDE68A; }
    
    @keyframes d18FrustumPulse {
      0%, 100% { stroke-opacity: 0.3; fill-opacity: 0.05; }
      50% { stroke-opacity: 0.9; fill-opacity: 0.15; }
    }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d18-bg)" stroke="url(#d18-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#1b1236" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">📐</text>
    <text x="46" y="19" fill="#FFFFFF" class="d18-title" font-size="16">Diagram 18: 3D Camera Projection &amp; Frustum Transform Animation Pipeline</text>
    <text x="46" y="33" fill="#94A3B8" class="d18-body" font-size="11">Model-View-Projection (MVP) Pipeline • Quaternion SLERP Interpolation • Normalized Device Coordinates (NDC) • 60 FPS WebGL</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 28)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#67E8F9" class="d18-mono">FRUSTUM: FOV 48°, FAR 1400</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#251644" stroke-width="1"/>

  <!-- LEFT: 3D Frustum Geometric Pyramid Simulation -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="410" height="345" rx="14" fill="#090e21" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="205" y="26" text-anchor="middle" fill="#67E8F9" class="d18-mono">3D PERSPECTIVE FRUSTUM PYRAMID</text>

    <!-- Camera Focal Eye Point -->
    <g transform="translate(50, 180)">
      <circle cx="0" cy="0" r="8" fill="#EC4899" filter="url(#d18-glow)"/>
      <text x="-35" y="4" fill="#F472B6" class="d18-mono">EYE (0,0,0)</text>
    </g>

    <!-- Near Clipping Plane (Near = 0.1) -->
    <polygon points="120,120 180,120 180,240 120,240" fill="#38bdf8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="150" y="112" text-anchor="middle" fill="#7DD3FC" class="d18-mono" font-size="9">NEAR PLANE (z=0.1)</text>

    <!-- Far Clipping Plane (Far = 1400) -->
    <polygon points="260,60 380,60 380,300 260,300" fill="#8b5cf6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="2" style="animation: d18FrustumPulse 2s ease-in-out infinite;"/>
    <text x="320" y="52" text-anchor="middle" fill="#C084FC" class="d18-mono" font-size="9">FAR PLANE (z=1400)</text>

    <!-- Frustum Ray Cones projecting from Camera Eye -->
    <line x1="50" y1="180" x2="380" y2="60" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="50" y1="180" x2="380" y2="300" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="50" y1="180" x2="260" y2="60" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="50" y1="180" x2="260" y2="300" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- 3D Stadium Mesh inside Frustum -->
    <g transform="translate(300, 180)">
      <ellipse cx="0" cy="20" rx="45" ry="25" fill="#083827" stroke="#10B981" stroke-width="1.5"/>
      <rect x="-6" y="5" width="12" height="30" fill="#78350f"/>
      <circle cx="15" cy="-5" r="4" fill="#EF4444" filter="url(#d18-glow)"/>
      <text x="0" y="65" text-anchor="middle" fill="#34D399" class="d18-mono" font-size="9">VISIBLE STADIUM MESH</text>
    </g>

    <!-- Quaternion SLERP Formula Box at bottom left -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="370" height="55" rx="8" fill="#171131" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="185" y="18" text-anchor="middle" fill="#DDD6FE" class="d18-mono">QUATERNION SLERP INTERPOLATION:</text>
      <text x="185" y="40" text-anchor="middle" class="d18-eq">Slerp(q_1, q_2, t) = [ sin((1-t)θ) q_1 + sin(tθ) q_2 ] / sin(θ)</text>
    </g>
  </g>

  <!-- RIGHT: 5-Stage MVP Matrix Pipeline -->
  <g transform="translate(480, 105)">
    <rect x="0" y="0" width="480" height="345" rx="14" fill="#100b24" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="20" y="15" width="440" height="28" rx="6" fill="#241544"/>
    <text x="240" y="33" text-anchor="middle" fill="#DDD6FE" class="d18-mono">📐 MODEL-VIEW-PROJECTION (MVP) MATRIX PIPELINE</text>

    <!-- STAGE 1: Model Matrix -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#171033" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="15" y="18" fill="#C084FC" class="d18-mono">1. MODEL MATRIX (M_model):</text>
      <text x="15" y="36" fill="#E2E8F0" class="d18-body">Transforms local stadium &amp; player vertices into 3D World Space (X_w, Y_w, Z_w)</text>
    </g>

    <!-- STAGE 2: View Matrix -->
    <g transform="translate(20, 112)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#101c36" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="15" y="18" fill="#7DD3FC" class="d18-mono">2. VIEW MATRIX (M_view):</text>
      <text x="15" y="36" fill="#E2E8F0" class="d18-body">Transforms World Space into Camera Eye Space via Quaternion Orientation</text>
    </g>

    <!-- STAGE 3: Projection Matrix -->
    <g transform="translate(20, 169)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#2d1326" stroke="#EC4899" stroke-width="0.8"/>
      <text x="15" y="18" fill="#F472B6" class="d18-mono">3. PROJECTION MATRIX (M_proj):</text>
      <text x="15" y="36" fill="#E2E8F0" class="d18-body">Perspective Frustum: FOV=48°, Aspect=W/H, Near=0.1, Far=1400</text>
    </g>

    <!-- STAGE 4: Clip Space & Perspective Divide -->
    <g transform="translate(20, 226)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#2d1c08" stroke="#F59E0B" stroke-width="0.8"/>
      <text x="15" y="18" fill="#FBBF24" class="d18-mono">4. CLIP SPACE &amp; PERSPECTIVE DIVIDE:</text>
      <text x="15" y="36" fill="#FDE68A" class="d18-mono">NDC = [X_c / W_c, Y_c / W_c, Z_c / W_c] ∈ [-1.0, +1.0]^3</text>
    </g>

    <!-- STAGE 5: Screen Viewport Canvas -->
    <g transform="translate(20, 283)">
      <rect x="0" y="0" width="440" height="48" rx="8" fill="#092921" stroke="#10B981" stroke-width="1.2"/>
      <text x="15" y="18" fill="#34D399" class="d18-mono">5. 60 FPS WEBGL CANVAS VIEWPORT:</text>
      <text x="15" y="36" fill="#A7F3D0" class="d18-mono">Viewport Transform: Screen (x, y) = [ (x_ndc+1)*W/2, (1-y_ndc)*H/2 ]</text>
      <circle cx="415" cy="24" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Animated Data Ray from Frustum to Pipeline -->
  <line x1="455" y1="275" x2="480" y2="275" stroke="#EC4899" stroke-width="2.5" stroke-dasharray="4,2"/>
  <circle r="4" fill="#EC4899" filter="url(#d18-glow)">
    <animateMotion path="M 455 275 L 480 275" dur="0.9s" repeatCount="indefinite"/>
  </circle>
</svg>
