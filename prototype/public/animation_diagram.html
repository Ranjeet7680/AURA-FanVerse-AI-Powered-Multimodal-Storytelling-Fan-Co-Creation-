  <title>AURA FanVerse — Live System & Animation Architecture Diagram</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.8)) drop-shadow(0 0 16px rgba(168, 85, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(236, 72, 153, 0.9)) drop-shadow(0 0 28px rgba(6, 182, 212, 0.6)); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes ripple {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .flow-dash {
      stroke-dasharray: 6 6;
      animation: dashMove 1.4s linear infinite;
    }
    .flow-dash-fast {
      stroke-dasharray: 5 5;
      animation: dashMove 0.8s linear infinite;
    }
    .node-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .ripple-ring {
      transform-origin: center;
      animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>
</head>

      });

      document.getElementById('readout-text').innerHTML = 
        `<strong class="text-cyan-300">Switched Mode:</strong> Active ${mode.toUpperCase()} view. Click any node to inspect telemetry.`;
    }

    function inspectNode(title, detail) {
      document.getElementById('readout-text').innerHTML = 
        `<strong class="text-cyan-300">${title}:</strong> <span class="text-slate-200">${detail}</span>`;
    }

    function toggleAnimation() {
      isPlaying = !isPlaying;
      document.getElementById('pause-icon').textContent = isPlaying ? '⏸️' : '▶️';
      document.getElementById('pause-text').textContent = isPlaying ? 'Pause' : 'Resume';
      
      const paths = document.querySelectorAll('.flow-dash, .flow-dash-fast');
      paths.forEach(p => {
        p.style.animationPlayState = isPlaying ? 'running' : 'paused';
      });
    }

    function changeSpeed() {
      if (animSpeed === 1.0) animSpeed = 2.0;
      else if (animSpeed === 2.0) animSpeed = 0.5;
      else animSpeed = 1.0;

      document.getElementById('btn-speed').textContent = animSpeed.toFixed(1) + 'x Speed';
      
      const paths = document.querySelectorAll('.flow-dash, .flow-dash-fast');
      paths.forEach(p => {
        p.style.animationDuration = (1.4 / animSpeed) + 's';
      });
    }

    // Particle flow canvas simulation in background
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * (canvas.width * 0.2);
        this.y = Math.random() * canvas.height;
        this.targetX = canvas.width;
        this.speed = (Math.random() * 2 + 1) * animSpeed;
        this.radius = Math.random() * 2 + 1.2;
        this.color = ['#06b6d4', '#a855f7', '#ec4899', '#10b981'][Math.floor(Math.random() * 4)];
        this.alpha = Math.random() * 0.7 + 0.3;
      }
      update() {
        if (!isPlaying) return;
        this.x += this.speed * animSpeed;
        if (this.x > canvas.width) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.shadowBlur = 6;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 35; i++) {
      particles.push(new Particle());
    }

    function animateLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateLoop);
    }
    animateLoop();

    // Initialize Default View
    setMode('flow');
  </script>
</body>
</html>
