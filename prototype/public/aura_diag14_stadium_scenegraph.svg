<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d14-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="50%" stop-color="#0f162e"/>
      <stop offset="100%" stop-color="#04050d"/>
    </linearGradient>

    <linearGradient id="d14-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="d14-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d14-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d14-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d14-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d14-bg)" stroke="url(#d14-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#0c233c" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">🏟️</text>
    <text x="46" y="19" fill="#FFFFFF" class="d14-title" font-size="16">Diagram 14: Real-Time 3D Cricket Stadium WebGL Scene Graph &amp; Camera Animation</text>
    <text x="46" y="33" fill="#94A3B8" class="d14-body" font-size="11">Three.js Object3D Hierarchy • 4 Dynamic Camera Modes • Quaternion Slerp Transitions • Dubai International Stadium</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 28)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#67E8F9" class="d14-mono">WEBGL RENDER LOOP: 60 FPS</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT: 3D Scene Graph Hierarchy Tree -->
  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="300" height="345" rx="12" fill="#0b1728" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="15" y="15" width="270" height="28" rx="6" fill="#0b324d"/>
    <text x="150" y="33" text-anchor="middle" fill="#67E8F9" class="d14-mono">🌐 THREE.JS SCENE GRAPH</text>

    <!-- Root Node -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0284c7"/>
      <text x="65" y="17" text-anchor="middle" fill="#FFFFFF" class="d14-mono">Scene (Root)</text>
    </g>

    <!-- Branch Lines -->
    <path d="M 65 81 L 65 310" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Child 1: Turf Mesh -->
    <g transform="translate(80, 95)">
      <line x1="-15" y1="13" x2="0" y2="13" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="30" rx="5" fill="#082b20" stroke="#10B981" stroke-width="0.8"/>
      <text x="10" y="19" fill="#34D399" class="d14-mono">🌱 TurfMesh (1024x1024 Stripes)</text>
    </g>

    <!-- Child 2: Clay Pitch -->
    <g transform="translate(80, 135)">
      <line x1="-15" y1="13" x2="0" y2="13" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="30" rx="5" fill="#2d1c08" stroke="#F59E0B" stroke-width="0.8"/>
      <text x="10" y="19" fill="#FBBF24" class="d14-mono">🏏 ClayPitch (Wear Texture)</text>
    </g>

    <!-- Child 3: Stumps & Crease -->
    <g transform="translate(80, 175)">
      <line x1="-15" y1="13" x2="0" y2="13" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="30" rx="5" fill="#132438" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="10" y="19" fill="#7DD3FC" class="d14-mono">📍 CreaseLines &amp; Stumps Rigs</text>
    </g>

    <!-- Child 4: Stadium Stands & Roof -->
    <g transform="translate(80, 215)">
      <line x1="-15" y1="13" x2="0" y2="13" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="30" rx="5" fill="#181335" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="10" y="19" fill="#C084FC" class="d14-mono">🏟️ Dubai Stands &amp; Floodlights</text>
    </g>

    <!-- Child 5: Burj Dubai Skyline -->
    <g transform="translate(80, 255)">
      <line x1="-15" y1="13" x2="0" y2="13" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="30" rx="5" fill="#2d1033" stroke="#EC4899" stroke-width="0.8"/>
      <text x="10" y="19" fill="#F472B6" class="d14-mono">🏙️ Procedural Burj Silhouette</text>
    </g>

    <!-- Child 6: Articulated Athlete Rigs -->
    <g transform="translate(80, 295)">
      <line x1="-15" y1="13" x2="0" y2="13" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="30" rx="5" fill="#0f2b24" stroke="#10B981" stroke-width="1"/>
      <text x="10" y="19" fill="#6EE7B7" class="d14-mono">🏃 Bowler Run-Up &amp; Batter Stance</text>
    </g>
  </g>

  <!-- CENTER: 3D Stadium & Skyline Wireframe Visualizer -->
  <g transform="translate(360, 105)">
    <rect x="0" y="0" width="310" height="345" rx="14" fill="#090e1f" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="155" y="28" text-anchor="middle" fill="#60A5FA" class="d14-mono">DUBAI STADIUM 3D MESH</text>

    <!-- Dubai Skyline Silhouette in Background -->
    <g transform="translate(25, 45)" opacity="0.6">
      <!-- Burj Khalifa Silhouette -->
      <polygon points="120,120 125,20 135,20 140,120" fill="#1e293b"/>
      <line x1="130" y1="20" x2="130" y2="5" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Surrounding Towers -->
      <rect x="70" y="70" width="22" height="50" fill="#1e293b"/>
      <rect x="98" y="55" width="16" height="65" fill="#1e293b"/>
      <rect x="150" y="60" width="24" height="60" fill="#1e293b"/>
      <rect x="180" y="80" width="30" height="40" fill="#1e293b"/>
    </g>

    <!-- 3D Stadium Stands Oval Perspective -->
    <ellipse cx="155" cy="205" rx="120" ry="75" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <ellipse cx="155" cy="215" rx="135" ry="85" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
    <ellipse cx="155" cy="205" rx="90" ry="50" fill="#063828" stroke="#10B981" stroke-width="1.5"/>

    <!-- Pitch Strip in Center -->
    <polygon points="146,185 164,185 168,225 142,225" fill="#78350f"/>
    <!-- Stumps -->
    <line x1="150" y1="185" x2="160" y2="185" stroke="#FDE68A" stroke-width="2"/>
    <line x1="147" y1="225" x2="163" y2="225" stroke="#FDE68A" stroke-width="2"/>

    <!-- 4 Stadium Floodlight Towers with Beams -->
    <g transform="translate(155, 205)">
      <!-- Tower 1: Top Left -->
      <line x1="-115" y1="-55" x2="-115" y2="-90" stroke="#38BDF8" stroke-width="2"/>
      <polygon points="-115,-90 -60,0 20,-20" fill="#38BDF8" fill-opacity="0.08"/>
      <!-- Tower 2: Top Right -->
      <line x1="115" y1="-55" x2="115" y2="-90" stroke="#38BDF8" stroke-width="2"/>
      <polygon points="115,-90 60,0 -20,-20" fill="#38BDF8" fill-opacity="0.08"/>
      <!-- Tower 3: Bottom Left -->
      <line x1="-120" y1="65" x2="-120" y2="30" stroke="#38BDF8" stroke-width="2"/>
      <!-- Tower 4: Bottom Right -->
      <line x1="120" y1="65" x2="120" y2="30" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <!-- Animated Camera Frustum Beacon rotating -->
    <circle cx="155" cy="205" r="4" fill="#EF4444" filter="url(#d14-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="155" y="325" text-anchor="middle" fill="#93C5FD" class="d14-mono">DUBAI INTERNATIONAL CRICKET STADIUM</text>
  </g>

  <!-- RIGHT: 4 Camera Viewport Modes & Slerp Controller -->
  <g transform="translate(690, 105)">
    <rect x="0" y="0" width="270" height="345" rx="12" fill="#131026" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="15" y="15" width="240" height="28" rx="6" fill="#2b1a52"/>
    <text x="135" y="33" text-anchor="middle" fill="#DDD6FE" class="d14-mono">🎥 CAMERA CONTROLLER (SLERP)</text>

    <!-- Cam 1 -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="240" height="58" rx="8" fill="#181333" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="10" y="18" fill="#C084FC" class="d14-mono">1. BROADCASTER ELEVATED</text>
      <text x="10" y="36" fill="#E2E8F0" class="d14-body">Position: (0, 38, 65) | FOV: 48°</text>
      <text x="10" y="50" fill="#94A3B8" class="d14-mono">Full ground tactical overview</text>
    </g>

    <!-- Cam 2 -->
    <g transform="translate(15, 120)">
      <rect x="0" y="0" width="240" height="58" rx="8" fill="#082b20" stroke="#10B981" stroke-width="1.2"/>
      <text x="10" y="18" fill="#34D399" class="d14-mono">★ 2. PITCH DYNAMIC (WICKET-TO-WICKET)</text>
      <text x="10" y="36" fill="#E2E8F0" class="d14-body">Position: (0, 6, 22) | FOV: 54°</text>
      <text x="10" y="50" fill="#6EE7B7" class="d14-mono">Low-angle seam drift &amp; swing</text>
      <circle cx="225" cy="18" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Cam 3 -->
    <g transform="translate(15, 185)">
      <rect x="0" y="0" width="240" height="58" rx="8" fill="#181333" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="10" y="18" fill="#C084FC" class="d14-mono">3. BOUNDARY LOW-ANGLE CHASE</text>
      <text x="10" y="36" fill="#E2E8F0" class="d14-body">Position: (0, 12, 52) | FOV: 60°</text>
      <text x="10" y="50" fill="#94A3B8" class="d14-mono">Fielder diving boundary catches</text>
    </g>

    <!-- Cam 4 -->
    <g transform="translate(15, 250)">
      <rect x="0" y="0" width="240" height="58" rx="8" fill="#2d102e" stroke="#EC4899" stroke-width="0.8"/>
      <text x="10" y="18" fill="#F472B6" class="d14-mono">4. DRONE 360° CONTINUOUS ORBIT</text>
      <text x="10" y="36" fill="#E2E8F0" class="d14-body">Radius: 75m | Speed: 0.25 rad/s</text>
      <text x="10" y="50" fill="#FBCFE8" class="d14-mono">Smooth cinematic drone tour</text>
    </g>

    <!-- Slerp Info Footer -->
    <g transform="translate(15, 314)">
      <text x="120" y="16" text-anchor="middle" fill="#FDE68A" class="d14-mono">Quaternion.slerp(q1, q2, 0.05)</text>
    </g>
  </g>
</svg>
