<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d16-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#140a2c"/>
      <stop offset="100%" stop-color="#05020e"/>
    </linearGradient>

    <linearGradient id="d16-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="d16-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d16-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d16-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d16-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    
    @keyframes d16W1 { 0%, 100% { height: 16px; y: 44px; } 50% { height: 50px; y: 10px; } }
    @keyframes d16W2 { 0%, 100% { height: 45px; y: 15px; } 50% { height: 20px; y: 40px; } }
    @keyframes d16W3 { 0%, 100% { height: 22px; y: 38px; } 50% { height: 54px; y: 6px; } }
    @keyframes d16W4 { 0%, 100% { height: 48px; y: 12px; } 50% { height: 14px; y: 46px; } }
    @keyframes d16W5 { 0%, 100% { height: 18px; y: 42px; } 50% { height: 42px; y: 18px; } }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d16-bg)" stroke="url(#d16-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#200d36" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">🎵</text>
    <text x="46" y="19" fill="#FFFFFF" class="d16-title" font-size="16">Diagram 16: Multilingual Audio Commentary &amp; Dancing Equalizer Wavebar State Machine</text>
    <text x="46" y="33" fill="#94A3B8" class="d16-body" font-size="11">Finite State Machine • Web Speech API Synthesis Lifecycle • 5 Staggered Oscillating Wavebars • 6-Language Routing</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 28)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#DDD6FE" class="d16-mono">AUDIO STATE: PLAYING 60FPS</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#251644" stroke-width="1"/>

  <!-- STATE 1: IDLE STANDBY (Top Left) -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#15122b" stroke="#64748B" stroke-width="1.5"/>
    <rect x="15" y="12" width="150" height="24" rx="5" fill="#1e2238"/>
    <text x="90" y="28" text-anchor="middle" fill="#94A3B8" class="d16-mono">STATE: IDLE</text>
    <text x="15" y="58" fill="#E2E8F0" class="d16-body">Audio Standing By</text>
    <text x="15" y="76" fill="#94A3B8" class="d16-mono">• Wavebars Collapsed (4px)</text>
    <text x="15" y="94" fill="#94A3B8" class="d16-mono">• Speech API Ready</text>
    <circle cx="160" cy="24" r="4" fill="#64748B"/>
  </g>

  <!-- Transition 1: Lang Selected -->
  <g transform="translate(230, 150)">
    <line x1="0" y1="20" x2="60" y2="20" stroke="#8B5CF6" stroke-width="2"/>
    <polygon points="55,16 63,20 55,24" fill="#8B5CF6"/>
    <text x="30" y="10" text-anchor="middle" fill="#C084FC" class="d16-mono" font-size="9">Select Lang</text>
    <circle r="3" fill="#8B5CF6">
      <animateMotion path="M 0 20 L 60 20" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STATE 2: FETCH CAPTION & DIALECT (Top Center-Left) -->
  <g transform="translate(290, 110)">
    <rect x="0" y="0" width="190" height="120" rx="12" fill="#1b1138" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="24" rx="5" fill="#2d1754"/>
    <text x="95" y="28" text-anchor="middle" fill="#DDD6FE" class="d16-mono">STATE: FETCH SCRIPT</text>
    <text x="15" y="58" fill="#E2E8F0" class="d16-body">Retrieve Dialect Caption</text>
    <text x="15" y="76" fill="#C084FC" class="d16-mono">Lang: te-IN (తెలుగు)</text>
    <text x="15" y="94" fill="#A78BFA" class="d16-mono">Query AI Tactical Script</text>
  </g>

  <!-- Transition 2: Synthesize Utterance -->
  <g transform="translate(480, 150)">
    <line x1="0" y1="20" x2="60" y2="20" stroke="#EC4899" stroke-width="2"/>
    <polygon points="55,16 63,20 55,24" fill="#EC4899"/>
    <text x="30" y="10" text-anchor="middle" fill="#F472B6" class="d16-mono" font-size="9">Utterance</text>
    <circle r="3" fill="#EC4899">
      <animateMotion path="M 0 20 L 60 20" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STATE 3: SYNTHESIZE VOICE (Top Center-Right) -->
  <g transform="translate(540, 110)">
    <rect x="0" y="0" width="190" height="120" rx="12" fill="#2d102e" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="24" rx="5" fill="#4d1645"/>
    <text x="95" y="28" text-anchor="middle" fill="#F472B6" class="d16-mono">STATE: SYNTHESIZE</text>
    <text x="15" y="58" fill="#E2E8F0" class="d16-body">SpeechSynthesisUtterance</text>
    <text x="15" y="76" fill="#FBCFE8" class="d16-mono">• Pitch: 1.05, Rate: 1.10</text>
    <text x="15" y="94" fill="#FBCFE8" class="d16-mono">• BCP-47 Binding</text>
  </g>

  <!-- Transition 3: onstart Event -> Active Playback -->
  <g transform="translate(730, 150)">
    <line x1="0" y1="20" x2="60" y2="20" stroke="#10B981" stroke-width="2.5"/>
    <polygon points="55,16 63,20 55,24" fill="#10B981"/>
    <text x="30" y="10" text-anchor="middle" fill="#34D399" class="d16-mono" font-size="9">onstart()</text>
    <circle r="3" fill="#10B981">
      <animateMotion path="M 0 20 L 60 20" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STATE 4: AUDIO PLAYING & DANCING EQUALIZER SUPERSTATE (Right / Lower Area) -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="900" height="190" rx="14" fill="#091f1b" stroke="#10B981" stroke-width="2" filter="url(#d16-glow)"/>
    <rect x="20" y="15" width="860" height="28" rx="6" fill="#0c4234"/>
    <text x="450" y="33" text-anchor="middle" fill="#6EE7B7" class="d16-mono">🔊 ACTIVE SUPERSTATE: AUDIO PLAYING &amp; 5-BAR FREQUENCY EQUALIZER</text>

    <!-- Dancing 5 Wavebars Container with Live Frequency Oscillation -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="220" height="95" rx="10" fill="#052019" stroke="#10B981" stroke-width="1.2"/>
      <text x="110" y="20" text-anchor="middle" fill="#A7F3D0" class="d16-mono">5 DANCING WAVEBARS</text>

      <!-- 5 Dynamic Wavebars with CSS Keyframes -->
      <g transform="translate(45, 25)">
        <rect x="0" width="18" rx="3" fill="#10B981" style="animation: d16W1 0.7s ease-in-out infinite;"/>
        <rect x="26" width="18" rx="3" fill="#06B6D4" style="animation: d16W2 0.6s ease-in-out infinite;"/>
        <rect x="52" width="18" rx="3" fill="#8B5CF6" style="animation: d16W3 0.8s ease-in-out infinite;"/>
        <rect x="78" width="18" rx="3" fill="#EC4899" style="animation: d16W4 0.65s ease-in-out infinite;"/>
        <rect x="104" width="18" rx="3" fill="#F59E0B" style="animation: d16W5 0.75s ease-in-out infinite;"/>
      </g>
    </g>

    <!-- Web Audio Spectrum & FFT Data -->
    <g transform="translate(290, 65)">
      <rect x="0" y="0" width="310" height="95" rx="10" fill="#0b241e" stroke="#059669" stroke-width="1"/>
      <text x="15" y="22" fill="#34D399" class="d16-mono">WEB AUDIO FFT ANALYSER NODE:</text>
      <text x="15" y="44" fill="#E2E8F0" class="d16-body">Oscillation: Bar 1 (25% → 95%) | Bar 2 (85% → 35%)</text>
      <text x="15" y="62" fill="#E2E8F0" class="d16-body">Oscillation: Bar 3 (45% → 100%) | Bar 4 (90% → 20%)</text>
      <text x="15" y="80" fill="#A7F3D0" class="d16-mono">FFT Size: 256 | Frequency: 60 FPS Canvas Render</text>
    </g>

    <!-- Dialect Readout Sample -->
    <g transform="translate(625, 65)">
      <rect x="0" y="0" width="255" height="95" rx="10" fill="#142c24" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="22" fill="#6EE7B7" class="d16-mono">LIVE COMMENTARY SPOKEN:</text>
      <text x="15" y="45" fill="#FDE68A" class="d16-body">"స్మృతి మంధాన అద్భుతమైన సిక్స్!</text>
      <text x="15" y="65" fill="#FDE68A" class="d16-body">మైదానం హోరెత్తుతోంది!"</text>
      <text x="15" y="84" fill="#67E8F9" class="d16-mono">Voice: Google తెలుగు te-IN</text>
    </g>
  </g>

  <!-- Return Path: onend event back to Idle -->
  <path d="M 50 355 Q 15 355 15 230 Q 15 170 50 170" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="46,166 54,170 46,174" fill="#64748B"/>
  <text x="25" y="225" text-anchor="middle" fill="#94A3B8" class="d16-mono" font-size="9" transform="rotate(-90 25 225)">onend() / Pause Toggle</text>
</svg>
