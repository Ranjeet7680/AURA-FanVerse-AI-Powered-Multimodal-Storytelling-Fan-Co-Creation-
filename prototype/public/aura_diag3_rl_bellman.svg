<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="d3-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="d3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d3-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d3-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d3-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .d3-eq { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #FDE68A; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d3-bg)" stroke="url(#d3-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#2d1c08" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">🤖</text>
    <text x="46" y="19" fill="#FFFFFF" class="d3-title" font-size="16">Diagram 3: Reinforcement Learning Bellman Optimization Loop</text>
    <text x="46" y="33" fill="#94A3B8" class="d3-body" font-size="11">Markov Decision Process (MDP) • Q-Learning Policy Iteration • Strategic Action Space • Dynamic Reward Feedback</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(745, 28)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#FDE68A" class="d3-mono">CONVERGENCE: γ=0.95, α=0.1</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Container: MDP Environment (State s) -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="260" height="250" rx="12" fill="#0b1728" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="15" y="12" width="230" height="26" rx="6" fill="#082235"/>
    <text x="130" y="29" text-anchor="middle" fill="#38BDF8" class="d3-mono">🏏 CRICKET FIELD MDP (s)</text>
    
    <g transform="translate(15, 52)">
      <rect x="0" y="0" width="230" height="38" rx="6" fill="#0f223d" stroke="#0284c7" stroke-width="0.8"/>
      <text x="12" y="16" fill="#7DD3FC" class="d3-mono">BATTER TENDENCY</text>
      <text x="12" y="30" fill="#E2E8F0" class="d3-body">Off-Drive (42%) | Lap Sweep (38%)</text>
    </g>

    <g transform="translate(15, 98)">
      <rect x="0" y="0" width="230" height="38" rx="6" fill="#0f223d" stroke="#0284c7" stroke-width="0.8"/>
      <text x="12" y="16" fill="#7DD3FC" class="d3-mono">BOWLER TYPE &amp; SEAM</text>
      <text x="12" y="30" fill="#E2E8F0" class="d3-body">Right-Arm Off-Spin (v=88 km/h)</text>
    </g>

    <g transform="translate(15, 144)">
      <rect x="0" y="0" width="230" height="38" rx="6" fill="#0f223d" stroke="#0284c7" stroke-width="0.8"/>
      <text x="12" y="16" fill="#7DD3FC" class="d3-mono">MATCH PHASE &amp; PRESSURE</text>
      <text x="12" y="30" fill="#E2E8F0" class="d3-body">Death Overs (18.4) | RRR: 11.2</text>
    </g>

    <g transform="translate(15, 190)">
      <rect x="0" y="0" width="230" height="46" rx="6" fill="#061e2f" stroke="#06B6D4" stroke-width="0.8"/>
      <text x="12" y="18" fill="#38BDF8" class="d3-mono">STATE VECTOR (s):</text>
      <text x="12" y="34" fill="#67E8F9" class="d3-mono">[0.42, 0.38, 88.0, 18.4, 11.2]</text>
    </g>
  </g>

  <!-- Center Container: Q-Learning Agent & Bellman Equation -->
  <g transform="translate(340, 95)">
    <rect x="0" y="0" width="320" height="260" rx="14" fill="#1e1808" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="20" y="12" width="280" height="28" rx="6" fill="#3b2308"/>
    <text x="160" y="30" text-anchor="middle" fill="#FBBF24" class="d3-mono">🤖 Q-LEARNING AGENT (POLICY)</text>

    <!-- Q-Table Matrix Rep -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="280" height="75" rx="8" fill="#140f06" stroke="#92400e" stroke-width="1"/>
      <text x="15" y="20" fill="#FDE68A" class="d3-mono">ε-Greedy Policy (ε = 0.05 Explore)</text>
      <text x="15" y="40" fill="#FCD34D" class="d3-mono">Q(s, a) Look-Up Table Matrix</text>
      <text x="15" y="60" fill="#A3E635" class="d3-mono">Best Action: a* = argmax Q(s, a)</text>
    </g>

    <!-- Bellman Equation Box with Glow -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="290" height="105" rx="10" fill="#2d1703" stroke="#F59E0B" stroke-width="1.2" filter="url(#d3-glow)"/>
      <text x="145" y="24" text-anchor="middle" fill="#FBBF24" class="d3-mono">BELLMAN TEMPORAL UPDATE</text>
      <line x1="20" y1="34" x2="270" y2="34" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="145" y="62" text-anchor="middle" class="d3-eq">Q(s,a) ← Q(s,a) + α [ r + γ max Q(s',a') − Q(s,a) ]</text>
      <text x="145" y="88" text-anchor="middle" fill="#FDE68A" class="d3-mono">Learning Rate α=0.1 • Discount γ=0.95</text>
    </g>
  </g>

  <!-- Right Container: 5 Strategic Field Coordinates (Action Space) -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="260" height="250" rx="12" fill="#081e18" stroke="#10B981" stroke-width="1.5"/>
    <rect x="15" y="12" width="230" height="26" rx="6" fill="#062e22"/>
    <text x="130" y="29" text-anchor="middle" fill="#34D399" class="d3-mono">🎯 ACTION SPACE (a ∈ A)</text>

    <!-- 5 Action Pills -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="230" height="32" rx="6" fill="#0c3426" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="20" fill="#6EE7B7" class="d3-mono">A0. Slip Cordon (r=18m, θ=-25°)</text>
    </g>
    <g transform="translate(15, 86)">
      <rect x="0" y="0" width="230" height="32" rx="6" fill="#0c3426" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="20" fill="#6EE7B7" class="d3-mono">A1. Deep Boundary Lock (r=72m)</text>
    </g>
    <g transform="translate(15, 124)">
      <rect x="0" y="0" width="230" height="32" rx="6" fill="#0c3426" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="20" fill="#6EE7B7" class="d3-mono">A2. Inner Ring Squeeze (r=28m)</text>
    </g>
    <g transform="translate(15, 162)">
      <rect x="0" y="0" width="230" height="32" rx="6" fill="#1b4231" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="218" cy="16" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="10" y="20" fill="#A7F3D0" class="d3-mono">★ A3. Targeted Leg-Trap [CHOSEN]</text>
    </g>
    <g transform="translate(15, 200)">
      <rect x="0" y="0" width="230" height="32" rx="6" fill="#0c3426" stroke="#059669" stroke-width="0.8"/>
      <text x="10" y="20" fill="#6EE7B7" class="d3-mono">A4. Off-Side Wall (Cover/Point)</text>
    </g>
  </g>

  <!-- Bottom Container: Reward Signal (r) Return Path -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="840" height="85" rx="12" fill="#130e24" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="25" y="25" fill="#C084FC" class="d3-mono">⚡ REWARD FUNCTION MATRIX (r):</text>

    <!-- Reward Badges -->
    <g transform="translate(25, 38)">
      <rect x="0" y="0" width="170" height="34" rx="6" fill="#064e3b" stroke="#10B981" stroke-width="1"/>
      <text x="85" y="21" text-anchor="middle" fill="#6EE7B7" class="d3-mono">WICKET TAKEN: +10</text>
    </g>
    <g transform="translate(210, 38)">
      <rect x="0" y="0" width="160" height="34" rx="6" fill="#065f46" stroke="#34D399" stroke-width="1"/>
      <text x="80" y="21" text-anchor="middle" fill="#A7F3D0" class="d3-mono">DOT BALL: +5</text>
    </g>
    <g transform="translate(385, 38)">
      <rect x="0" y="0" width="160" height="34" rx="6" fill="#78350f" stroke="#F59E0B" stroke-width="1"/>
      <text x="80" y="21" text-anchor="middle" fill="#FDE68A" class="d3-mono">SINGLE / TWO: -1</text>
    </g>
    <g transform="translate(560, 38)">
      <rect x="0" y="0" width="150" height="34" rx="6" fill="#7f1d1d" stroke="#EF4444" stroke-width="1"/>
      <text x="75" y="21" text-anchor="middle" fill="#FCA5A5" class="d3-mono">FOUR CONCEDED: -6</text>
    </g>
    <g transform="translate(725, 38)">
      <rect x="0" y="0" width="95" height="34" rx="6" fill="#450a0a" stroke="#DC2626" stroke-width="1"/>
      <text x="47" y="21" text-anchor="middle" fill="#F87171" class="d3-mono">SIX: -12</text>
    </g>
  </g>

  <!-- ANIMATED FLOW CONDUITS -->
  <!-- 1. State to Agent -->
  <path d="M 300 220 L 340 220" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6,4"/>
  <circle r="4" fill="#06B6D4" filter="url(#d3-glow)">
    <animateMotion path="M 300 220 L 340 220" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- 2. Agent to Action Space -->
  <path d="M 660 220 L 700 220" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
  <circle r="4" fill="#F59E0B" filter="url(#d3-glow)">
    <animateMotion path="M 660 220 L 700 220" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- 3. Action executed in Environment (Step Down & Loop) -->
  <path d="M 830 350 L 830 380" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle r="4" fill="#10B981">
    <animateMotion path="M 830 350 L 830 380" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 4. Reward feedback loop to Bellman update -->
  <path d="M 500 380 L 500 355" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6,4"/>
  <circle r="5" fill="#C084FC" filter="url(#d3-glow)">
    <animateMotion path="M 500 380 L 500 355" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
