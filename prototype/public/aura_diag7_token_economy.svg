<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="d7-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0818"/>
      <stop offset="50%" stop-color="#180e2b"/>
      <stop offset="100%" stop-color="#06030f"/>
    </linearGradient>

    <linearGradient id="d7-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="d7-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .d7-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; }
    .d7-mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .d7-body { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    
    @keyframes d7Confetti {
      0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(40px) rotate(180deg); opacity: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="480" rx="20" fill="url(#d7-bg)" stroke="url(#d7-neon)" stroke-width="2"/>

  <!-- Title Header -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#301124" stroke="#EC4899" stroke-width="1.5"/>
    <text x="8" y="23" font-size="18">💖</text>
    <text x="46" y="19" fill="#FFFFFF" class="d7-title" font-size="16">Diagram 7: Micro-Sponsorship Token Economy &amp; Grassroots Distribution</text>
    <text x="46" y="33" fill="#94A3B8" class="d7-body" font-size="11">Direct Female Athlete Sponsorship • 85/15 Transparent Smart Split • ICC Future Stars Fund • Verifiable Proof-of-Impact</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(735, 28)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#EC4899" fill-opacity="0.12" stroke="#EC4899" stroke-width="1.2" />
    <circle cx="14" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#F472B6" class="d7-mono">SMART CONTRACT: VERIFIED</text>
  </g>

  <line x1="35" y1="75" x2="965" y2="75" stroke="#2c173d" stroke-width="1"/>

  <!-- NODE 1: Fan & Token Pledge (Left) -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="250" height="330" rx="14" fill="#150f29" stroke="#EC4899" stroke-width="1.5"/>
    <rect x="20" y="15" width="210" height="28" rx="6" fill="#2d132d"/>
    <text x="125" y="33" text-anchor="middle" fill="#F472B6" class="d7-mono">👤 FAN / SUPPORTER</text>

    <!-- Token Purchase -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="210" height="60" rx="8" fill="#1e1038" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="12" y="20" fill="#DDD6FE" class="d7-mono">ACQUIRE TOKENS</text>
      <text x="12" y="38" fill="#94A3B8" class="d7-body">Fiat (USD/INR/AED) or Web3</text>
      <text x="12" y="52" fill="#A78BFA" class="d7-mono">1 Token = $0.20 USD</text>
    </g>

    <!-- Micro-Pledge Trigger -->
    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="210" height="75" rx="8" fill="#2d1d07" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="12" y="20" fill="#FBBF24" class="d7-mono">MICRO-PLEDGE (50 TOKENS)</text>
      <text x="12" y="40" fill="#FDE68A" class="d7-body">Pledge to: Smriti Mandhana /</text>
      <text x="12" y="56" fill="#FDE68A" class="d7-body">Grassroots Future Star ($10.00)</text>
      <circle cx="195" cy="20" r="4" fill="#F59E0B">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Gamification & Rewards Received -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="210" height="85" rx="8" fill="#0c251c" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="20" fill="#34D399" class="d7-mono">FAN REWARD &amp; BADGE</text>
      <text x="12" y="40" fill="#E2E8F0" class="d7-body">🏅 "Patron of Women's Sport"</text>
      <text x="12" y="58" fill="#A7F3D0" class="d7-mono">Global Leaderboard +150 XP</text>
      <text x="12" y="74" fill="#6EE7B7" class="d7-mono">Proof-of-Impact NFT Ticket</text>
    </g>
  </g>

  <!-- NODE 2: Smart Token Splitter (Center) -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="280" height="220" rx="14" fill="#241708" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="20" y="15" width="240" height="28" rx="6" fill="#452709"/>
    <text x="140" y="33" text-anchor="middle" fill="#FBBF24" class="d7-mono">⚖️ SMART TOKEN SPLITTER</text>

    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#132a1f" stroke="#10B981" stroke-width="1.2"/>
      <text x="12" y="22" fill="#6EE7B7" class="d7-mono">85% DIRECT TO ATHLETE</text>
      <text x="12" y="40" fill="#A7F3D0" class="d7-body">42.5 Tokens ($8.50 USD)</text>
    </g>

    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="240" height="50" rx="8" fill="#261238" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="12" y="22" fill="#DDD6FE" class="d7-mono">15% ICC FUTURE STARS</text>
      <text x="12" y="40" fill="#C084FC" class="d7-body">7.5 Tokens ($1.50 USD)</text>
    </g>

    <g transform="translate(20, 185)">
      <text x="120" y="18" text-anchor="middle" fill="#FDE68A" class="d7-mono">0% Intermediary Fee • 100% On-Chain</text>
    </g>
  </g>

  <!-- NODE 3: Athlete Equipment & Travel Wallet (Top Right) -->
  <g transform="translate(690, 105)">
    <rect x="0" y="0" width="270" height="150" rx="14" fill="#09271c" stroke="#10B981" stroke-width="1.8"/>
    <rect x="20" y="15" width="230" height="26" rx="6" fill="#0c4a34"/>
    <text x="135" y="32" text-anchor="middle" fill="#6EE7B7" class="d7-mono">🏅 ATHLETE WALLET (85%)</text>
    
    <text x="20" y="65" fill="#E2E8F0" class="d7-body">Direct Equipment &amp; Travel Grant</text>
    <text x="20" y="85" fill="#A7F3D0" class="d7-mono">• English Willow Bats &amp; Protective Kit</text>
    <text x="20" y="103" fill="#A7F3D0" class="d7-mono">• High-Performance Nutrition &amp; S&amp;C</text>
    <text x="20" y="121" fill="#A7F3D0" class="d7-mono">• International Travel &amp; Lodging</text>
    <text x="20" y="139" fill="#34D399" class="d7-mono">Settlement: Instant Polygon / USDC</text>
  </g>

  <!-- NODE 4: Grassroots Future Stars Fund (Bottom Right) -->
  <g transform="translate(690, 280)">
    <rect x="0" y="0" width="270" height="160" rx="14" fill="#1a1033" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="20" y="15" width="230" height="26" rx="6" fill="#2d1754"/>
    <text x="135" y="32" text-anchor="middle" fill="#D8B4FE" class="d7-mono">🌱 FUTURE STARS FUND (15%)</text>
    
    <text x="20" y="65" fill="#E2E8F0" class="d7-body">ICC Associate Nation Academies</text>
    <text x="20" y="85" fill="#DDD6FE" class="d7-mono">• UAE Women's Emerging Academy</text>
    <text x="20" y="103" fill="#DDD6FE" class="d7-mono">• Thailand Cricket Association</text>
    <text x="20" y="121" fill="#DDD6FE" class="d7-mono">• Scotland &amp; Netherlands Pathways</text>
    <text x="20" y="142" fill="#A78BFA" class="d7-mono">Grassroots Impact Multiplier: 10x</text>
  </g>

  <!-- FLOW CONDUITS & ANIMATED TOKEN PARTICLES -->
  <!-- Fan Pledge -> Splitter -->
  <line x1="290" y1="270" x2="350" y2="270" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,3"/>
  <circle r="5" fill="#F59E0B" filter="url(#d7-glow)">
    <animateMotion path="M 290 270 L 350 270" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Splitter -> 85% Athlete Wallet -->
  <path d="M 630 220 Q 660 180 690 180" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6,4"/>
  <circle r="5" fill="#10B981" filter="url(#d7-glow)">
    <animateMotion path="M 630 220 Q 660 180 690 180" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Splitter -> 15% Grassroots Fund -->
  <path d="M 630 290 Q 660 340 690 340" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6,4"/>
  <circle r="5" fill="#8B5CF6" filter="url(#d7-glow)">
    <animateMotion path="M 630 290 Q 660 340 690 340" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
